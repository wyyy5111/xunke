name: Windows standalone installer smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble embedded Windows runtime
        shell: pwsh
        run: python scripts/build_windows_runtime.py

      - name: Build NSIS installer
        shell: pwsh
        run: |
          Set-Location desktop
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: Native installer smoke test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop/windows_smoke_test.ps1 -OutputPath windows-smoke.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xunkeflow-windows-x64-installer
          path: |
            desktop/dist/*Setup.exe
            windows-smoke.log
