<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>循课正在启动</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eef7ff; background: radial-gradient(circle at 20% 15%, #153a6b 0, transparent 38%), radial-gradient(circle at 82% 75%, #123f52 0, transparent 35%), #071225; overflow: hidden; }
      body::before { content: ""; position: fixed; inset: 0; opacity: .14; background-image: linear-gradient(rgba(82,205,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(82,205,255,.35) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(to bottom, #000, transparent); }
      main { position: relative; width: min(680px, calc(100vw - 64px)); padding: 48px 52px; border: 1px solid rgba(119,220,255,.32); border-radius: 28px; background: rgba(8,24,48,.78); box-shadow: 0 30px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(22px); }
      .eyebrow { color: #6fe4ff; font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: 38px; letter-spacing: -.02em; }
      p { margin: 0; color: #a9bdd4; font-size: 16px; line-height: 1.8; }
      .bar { height: 5px; margin-top: 34px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
      .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #49a8ff, #60f2dc); animation: loading 1.35s ease-in-out infinite; box-shadow: 0 0 22px #48dfff; }
      .status { display: flex; justify-content: space-between; margin-top: 16px; color: #7190ad; font-size: 13px; }
      @keyframes loading { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">XunkeFlow · Standalone Desktop</div>
      <h1>正在启动循课</h1>
      <p>正在初始化本地数据库、课程知识库与多智能体运行环境。首次启动可能需要稍长时间，无需安装 Docker、Node.js 或 Python。</p>
      <div class="bar"></div>
      <div class="status"><span>本地安全运行</span><span>请稍候</span></div>
    </main>
  </body>
</html>
